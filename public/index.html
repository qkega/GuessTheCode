<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Угадай код</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap');

  :root {
    --bg: #0b0e14; 
    --panel: #151a24; 
    --line: #232a3b;
    --text: #ffffff; 
    --muted: #6b7a99;
    --green: #00d26a; 
    --yellow: #ffb300; 
    --red: #ff4757;
    --accent: #4a7dff;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: 'Nunito', sans-serif; }
  
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px;
    background: var(--bg); color: var(--text);
    overflow: hidden; user-select: none; transition: filter 0.3s ease;
  }

  body.blur-active > *:not(.modal-overlay) { filter: blur(8px); pointer-events: none; }
  .hidden { display: none !important; }

  /* КНОПКИ И ПОЛЯ */
  button { border: none; outline: none; cursor: pointer; font-weight: 800; transition: all 0.1s; }
  button:active { transform: scale(0.96); }
  .btn-primary { background: var(--accent); color: #fff; padding: 16px; border-radius: 12px; font-size: 16px; width: 100%; }
  .btn-secondary { background: var(--line); color: var(--text); padding: 16px; border-radius: 12px; font-size: 16px; width: 100%; }
  .btn-icon { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 10px; padding: 8px; display: flex; align-items: center; justify-content: center; }
  .btn-icon svg { width: 20px; height: 20px; fill: currentColor; }
  
  input[type="text"], input[type="password"] { 
    background: #000; border: 2px solid var(--line); border-radius: 12px; padding: 14px; 
    color: var(--text); font-size: 16px; font-weight: 600; outline: none; width: 100%; transition: border 0.2s;
  }
  input:focus { border-color: var(--accent); }

  /* ГЛАВНОЕ МЕНЮ */
  .menu-box {
    background: var(--panel); padding: 24px; border-radius: 24px; border: 1px solid var(--line);
    width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .menu-box h1 { margin: 0; font-size: 28px; text-align: center; font-weight: 900; letter-spacing: 1px; }
  .input-group { display: flex; gap: 8px; }
  
  /* ИГРОВОЙ ЭКРАН */
  .game-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 12px; }
  .status { font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
  
  .my-code-panel {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 16px;
  }
  .my-code-label { font-size: 13px; color: var(--muted); font-weight: 800; text-transform: uppercase; }
  .my-code-digits { display: flex; gap: 6px; }
  .my-code-digit {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; background: #000; border-radius: 6px; color: var(--muted);
  }
  .my-code-digit.green { background: var(--green); color: #000; }
  
  .board { display: flex; gap: 8px; width: 100%; margin-top: 12px; }
  .cell {
    flex: 1; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 900; border-radius: 12px;
    background: var(--panel); border: 2px solid var(--line); color: var(--text); transition: all 0.2s;
  }
  .cell.locked { background: var(--green); border-color: var(--green); color: #000; }
  .cell.cursor { border-color: var(--accent); }
  .cell.fade-yellow { background: rgba(255, 179, 0, 0.1); border-color: rgba(255, 179, 0, 0.3); color: var(--yellow); }
  .cell.fade-gray { background: #000; border-color: var(--line); color: transparent; opacity: 0.5; }

  /* ОТСТУП МЕЖДУ СТРОКОЙ И КЛАВИАТУРОЙ */
  .pad-container { width: 100%; margin-top: 32px; }
  .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  
  .pad button {
    position: relative; padding: 18px 0; font-size: 24px; font-weight: 900;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
  }
  .pad button:active:not(:disabled) { background: var(--line); }
  .pad button:disabled { opacity: 0.3; cursor: not-allowed; background: #000; border-color: transparent; }
  .pad button.hint { border-color: var(--yellow); color: var(--yellow); }
  .pad button.hint::after { content: attr(data-hint); position: absolute; top: 4px; right: 6px; font-size: 11px; color: var(--yellow); }
  
  .btn-submit { background: rgba(0, 210, 106, 0.1) !important; border-color: var(--green) !important; color: var(--green) !important; }
  .btn-submit:active:not(:disabled) { background: rgba(0, 210, 106, 0.2) !important; }
  .btn-submit:disabled { background: #000 !important; border-color: var(--line) !important; color: var(--muted) !important; }
  
  .btn-reset { background: rgba(255, 71, 87, 0.1) !important; border-color: var(--red) !important; color: var(--red) !important; }
  .btn-reset:active:not(:disabled) { background: rgba(255, 71, 87, 0.2) !important; }

  /* МОДАЛЬНЫЕ ОКНА */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  .modal-content {
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 24px;
    width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8); animation: popIn 0.3s ease;
  }
  .modal-content h2 { margin: 0; font-size: 20px; text-align: center; font-weight: 900; }
  .modal-content p { margin: 0; text-align: center; color: var(--muted); font-size: 14px; font-weight: 600; }
  
  .modal-inputs { display: flex; gap: 6px; justify-content: center; }
  .modal-inputs input {
    width: 100%; aspect-ratio: 1/1; background: #000; border: 2px solid var(--line);
    border-radius: 10px; color: var(--text); font-size: 24px; font-weight: 900; text-align: center; padding: 0;
  }
  .modal-inputs input:focus { border-color: var(--accent); }

  .room-code-display {
    font-size: 32px; font-weight: 900; letter-spacing: 6px; text-align: center; color: var(--accent);
    background: #000; padding: 16px; border-radius: 12px; border: 2px solid var(--line);
  }
  
  .spinner { border: 4px solid var(--line); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 10px auto; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

  /* УВЕДОМЛЕНИЯ */
  .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast {
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    padding: 14px 20px; border-radius: 12px; color: var(--text); font-weight: 800;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideDown 0.3s ease forwards;
  }
  .toast.error { border-left-color: var(--red); }
  .toast.success { border-left-color: var(--green); }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

  svg.icon { width: 24px; height: 24px; fill: currentColor; }
</style>
</head>
<body>

<!-- УВЕДОМЛЕНИЯ -->
<div class="toast-container" id="toast-container"></div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div class="menu-box" id="main-menu">
  <h1>УГАДАЙ КОД</h1>
  <div class="input-group">
    <input type="text" id="nick-input" placeholder="Твой ник" maxlength="15">
    <button class="btn-icon" onclick="saveNick()" title="Сохранить">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    </button>
  </div>
  <button class="btn-primary" onclick="openModeMenu()">Играть</button>
  <button class="btn-secondary" onclick="openSettings()">Настройки</button>
</div>

<!-- МЕНЮ РЕЖИМОВ -->
<div class="modal-overlay hidden" id="mode-menu">
  <div class="modal-content">
    <h2>Режим игры</h2>
    <button class="btn-primary" onclick="startBotGame()">Против Бота</button>
    <button class="btn-secondary" onclick="openOnlineMenu()">Сетевая игра</button>
    <button class="btn-secondary" style="background: transparent; border: 1px solid var(--line);" onclick="closeModal('mode-menu')">Назад</button>
  </div>
</div>

<!-- ОНЛАЙН МЕНЮ -->
<div class="modal-overlay hidden" id="online-menu">
  <div class="modal-content">
    <h2>Сетевая игра</h2>
    <button class="btn-primary" onclick="showCodeInput('random')">Случайный поиск</button>
    <button class="btn-primary" style="background: var(--green); color: #000;" onclick="showCodeInput('create')">Создать комнату</button>
    <button class="btn-secondary" onclick="showJoinInput()">Войти по коду</button>
    <button class="btn-secondary" style="background: transparent; border: 1px solid var(--line);" onclick="closeModal('online-menu')">Назад</button>
  </div>
</div>

<!-- ЭКРАН ВВОДА КОДА -->
<div class="modal-overlay hidden" id="code-screen">
  <div class="modal-content">
    <h2>Загадайте код</h2>
    <p>Введите 6 цифр, которые будет угадывать соперник</p>
    <div class="modal-inputs" id="modal-inputs"></div>
    <button class="btn-secondary" onclick="randomizeModal()">Рандом</button>
    <button class="btn-primary" onclick="confirmCode()">Продолжить</button>
    <button class="btn-secondary" style="background: transparent; border: 1px solid var(--line);" onclick="closeModal('code-screen')">Отмена</button>
  </div>
</div>

<!-- ЭКРАН ОЖИДАНИЯ / КОМНАТЫ -->
<div class="modal-overlay hidden" id="waiting-screen">
  <div class="modal-content">
    <h2 id="waiting-title">Поиск...</h2>
    <p id="waiting-desc">Ожидание соперника</p>
    <div class="room-code-display hidden" id="room-code-display">XXXXXX</div>
    <div class="spinner" id="waiting-spinner"></div>
    <button class="btn-secondary" onclick="location.reload()">Отмена</button>
  </div>
</div>

<!-- ЭКРАН ВХОДА ПО КОДУ КОМНАТЫ -->
<div class="modal-overlay hidden" id="join-screen">
  <div class="modal-content">
    <h2>Вход по коду</h2>
    <p>Введите 6-значный код комнаты</p>
    <input type="text" id="join-code-input" placeholder="XXXXXX" maxlength="6" style="text-align: center; font-size: 24px; letter-spacing: 4px; text-transform: uppercase;">
    <button class="btn-primary" onclick="submitJoin()">Войти</button>
    <button class="btn-secondary" style="background: transparent; border: 1px solid var(--line);" onclick="closeModal('join-screen')">Отмена</button>
  </div>
</div>

<!-- НАСТРОЙКИ -->
<div class="modal-overlay hidden" id="settings-modal">
  <div class="modal-content">
    <h2>Настройки</h2>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span>Сложность бота</span>
      <select id="setting-difficulty" onchange="saveSettings()" style="padding: 8px; border-radius: 8px; background: #000; color: #fff; border: 1px solid var(--line);">
        <option value="easy">Новичок</option>
        <option value="hard">Профи (ИИ)</option>
      </select>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span>Цвет интерфейса</span>
      <select id="setting-color" onchange="saveSettings()" style="padding: 8px; border-radius: 8px; background: #000; color: #fff; border: 1px solid var(--line);">
        <option value="#4a7dff">Синий</option>
        <option value="#00d26a">Зеленый</option>
        <option value="#ff4757">Красный</option>
        <option value="#a855f7">Фиолетовый</option>
        <option value="#ffb300">Желтый</option>
      </select>
    </div>
    <button class="btn-primary" onclick="closeModal('settings-modal')">Готово</button>
  </div>
</div>

<!-- ИГРОВОЙ ЭКРАН -->
<div class="game-container hidden" id="game-screen">
  <div class="top-bar">
    <button class="btn-icon" onclick="leaveGame()">
      <svg class="icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
    <div class="status" id="status-text">ОЖИДАНИЕ</div>
    <button class="btn-icon" onclick="openChat()">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </button>
  </div>

  <div class="my-code-panel">
    <div class="my-code-label">Ваш код</div>
    <div class="my-code-digits" id="my-code-digits"></div>
  </div>

  <div class="board" id="board"></div>
  
  <!-- Клавиатура с отступом -->
  <div class="pad-container">
    <div class="pad" id="pad">
      <button data-val="1">1</button>
      <button data-val="2">2</button>
      <button data-val="3">3</button>
      <button class="btn-submit" data-val="submit" id="btn-submit">✓</button>
      
      <button data-val="4">4</button>
      <button data-val="5">5</button>
      <button data-val="6">6</button>
      <button class="btn-reset" data-val="clear">×</button>
      
      <button data-val="7">7</button>
      <button data-val="8">8</button>
      <button data-val="9">9</button>
      <button data-val="0">0</button>
    </div>
  </div>
</div>

<!-- ЧАТ -->
<div class="modal-overlay hidden" id="chat-modal">
  <div class="modal-content" style="height: 60vh;">
    <h2>Чат</h2>
    <div id="chat-history" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px;"></div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="chat-input" placeholder="Сообщение..." onkeydown="if(event.key === 'Enter') sendChat()">
      <button class="btn-icon" onclick="sendChat()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <button class="btn-secondary" onclick="closeModal('chat-modal')">Закрыть</button>
  </div>
</div>

<!-- ТОСТ ХОДА -->
<div class="toast" id="move-toast" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); opacity: 0; pointer-events: none; z-index: 3000; padding: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; border-left: none; border: 1px solid var(--line);">
</div>

<script>
"use strict";
const socket = io();
const CODE_LEN = 6;

let myUsername = localStorage.getItem("gc_nick") || "";
let isOnline = false;
let gameMode = "";
let mySecretCode = "";
let targetRoomCode = "";
let roomId = null;
let currentTurn = null;
let opponentName = "Бот";

let locked = Array(CODE_LEN).fill(false);
let lockedDigits = Array(CODE_LEN).fill(null);
let input = Array(CODE_LEN).fill("");
let attempts = [];
let cursor = 0;
let lastMarks = Array(CODE_LEN).fill("");
let lastGuess = null;

// Bot vars
let botLockedDigits = Array(CODE_LEN).fill(null);
let botKnownWrong = new Set();
let botCandidates = [];
let secretBot = "";
let myCodeStatus = Array(CODE_LEN).fill("gray");

const el = {
  mainMenu: document.getElementById("main-menu"),
  modeMenu: document.getElementById("mode-menu"),
  onlineMenu: document.getElementById("online-menu"),
  codeScreen: document.getElementById("code-screen"),
  waitingScreen: document.getElementById("waiting-screen"),
  waitingTitle: document.getElementById("waiting-title"),
  waitingDesc: document.getElementById("waiting-desc"),
  roomCodeDisplay: document.getElementById("room-code-display"),
  joinScreen: document.getElementById("join-screen"),
  gameScreen: document.getElementById("game-screen"),
  statusText: document.getElementById("status-text"),
  board: document.getElementById("board"),
  pad: document.getElementById("pad"),
  myCodeDigits: document.getElementById("my-code-digits"),
  modalInputs: document.getElementById("modal-inputs"),
  nickInput: document.getElementById("nick-input"),
  moveToast: document.getElementById("move-toast"),
  chatHistory: document.getElementById("chat-history")
};

if (myUsername) el.nickInput.value = myUsername;
loadSettings();

/* ============ УВЕДОМЛЕНИЯ ============ */
function showNotify(msg, type = "info") {
  const container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
}

function showMoveToast(guess, marks) {
  el.moveToast.innerHTML = "";
  const title = document.createElement("div");
  title.style.cssText = "width: 100%; text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 800; text-transform: uppercase;";
  title.textContent = `Ход ${opponentName}`;
  el.moveToast.appendChild(title);

  const row = document.createElement("div");
  row.style.cssText = "display: flex; gap: 6px; justify-content: center; width: 100%;";
  guess.split("").forEach((d, i) => {
    const c = document.createElement("div");
    let bg = "var(--line)"; let color = "var(--muted)";
    if (marks[i] === "green") { bg = "var(--green)"; color = "#000"; }
    if (marks[i] === "yellow") { bg = "var(--yellow)"; color = "#000"; }
    c.style.cssText = `width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; border-radius: 8px; background: ${bg}; color: ${color};`;
    c.textContent = d;
    row.appendChild(c);
  });
  el.moveToast.appendChild(row);

  el.moveToast.style.opacity = "1";
  setTimeout(() => { el.moveToast.style.opacity = "0"; }, 3000);
}

/* ============ МЕНЮ И НАСТРОЙКИ ============ */
function closeModal(id) { document.getElementById(id).classList.add("hidden"); }
function openModal(id) { document.getElementById(id).classList.remove("hidden"); }

function saveNick() {
  const val = el.nickInput.value.trim();
  if (!/^[a-zA-Z0-9_-]{3,15}$/.test(val)) { showNotify("Ник: от 3 до 15 символов (латиница, цифры, _ -)", "error"); return; }
  myUsername = val;
  localStorage.setItem("gc_nick", val);
  showNotify("Ник сохранен", "success");
}

function openModeMenu() {
  if (!myUsername) { showNotify("Сначала сохрани ник!", "error"); return; }
  openModal("mode-menu");
}

function openOnlineMenu() {
  closeModal("mode-menu");
  openModal("online-menu");
}

function openSettings() { openModal("settings-modal"); }

function saveSettings() {
  localStorage.setItem("gc_diff", document.getElementById("setting-difficulty").value);
  localStorage.setItem("gc_color", document.getElementById("setting-color").value);
  document.documentElement.style.setProperty('--accent', document.getElementById("setting-color").value);
}

function loadSettings() {
  document.getElementById("setting-difficulty").value = localStorage.getItem("gc_diff") || "hard";
  const color = localStorage.getItem("gc_color") || "#4a7dff";
  document.getElementById("setting-color").value = color;
  document.documentElement.style.setProperty('--accent', color);
}

function leaveGame() { location.reload(); }

/* ============ ВВОД КОДА И ОНЛАЙН ============ */
function showCodeInput(mode) {
  gameMode = mode;
  closeModal("online-menu");
  openModal("code-screen");
  
  el.modalInputs.innerHTML = "";
  for (let i = 0; i < CODE_LEN; i++) {
    const inp = document.createElement("input");
    inp.type = "text"; inp.maxLength = 1; inp.inputMode = "numeric";
    inp.addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, "");
      if (e.target.value && i < CODE_LEN - 1) el.modalInputs.children[i + 1].focus();
    });
    el.modalInputs.appendChild(inp);
  }
}

function randomizeModal() {
  Array.from(el.modalInputs.children).forEach(inp => inp.value = Math.floor(Math.random() * 10));
}

function confirmCode() {
  const code = Array.from(el.modalInputs.children).map(inp => inp.value.trim()).join("");
  if (code.length !== CODE_LEN) { showNotify("Введи все 6 цифр!", "error"); return; }
  mySecretCode = code;
  
  closeModal("code-screen");
  openModal("waiting-screen");
  el.roomCodeDisplay.classList.add("hidden");
  document.getElementById("waiting-spinner").classList.remove("hidden");

  if (gameMode === "random") {
    el.waitingTitle.textContent = "Поиск соперника...";
    el.waitingDesc.textContent = "Подбираем случайного игрока";
    socket.emit('find_random', { username: myUsername, code: mySecretCode });
  } else if (gameMode === "create") {
    el.waitingTitle.textContent = "Создание комнаты...";
    el.waitingDesc.textContent = "Ожидание подключения друга";
    socket.emit('create_room', { username: myUsername, code: mySecretCode });
  } else if (gameMode === "join") {
    el.waitingTitle.textContent = "Подключение...";
    el.waitingDesc.textContent = "Входим в комнату " + targetRoomCode;
    socket.emit('join_room', { username: myUsername, code: mySecretCode, roomCode: targetRoomCode });
  }
}

function showJoinInput() {
  closeModal("online-menu");
  document.getElementById("join-code-input").value = "";
  openModal("join-screen");
}

function submitJoin() {
  const code = document.getElementById("join-code-input").value.trim().toUpperCase();
  if (code.length !== 6) { showNotify("Код должен быть 6 символов", "error"); return; }
  targetRoomCode = code;
  closeModal("join-screen");
  showCodeInput("join");
}

/* ============ СОКЕТЫ ============ */
socket.on('waiting_random', () => {});

socket.on('room_created', (data) => {
  el.waitingTitle.textContent = "Комната создана";
  el.waitingDesc.textContent = "Отправь этот код другу:";
  el.roomCodeDisplay.textContent = data.roomCode;
  el.roomCodeDisplay.classList.remove("hidden");
  document.getElementById("waiting-spinner").classList.add("hidden");
});

socket.on('err_msg', (msg) => {
  showNotify(msg, "error");
  location.reload();
});

socket.on('game_start', (data) => {
  isOnline = true;
  roomId = data.roomId;
  currentTurn = data.turn;
  opponentName = (data.p1_name === myUsername) ? data.p2_name : data.p1_name;

  closeModal("waiting-screen");
  el.mainMenu.classList.add("hidden");
  el.gameScreen.classList.remove("hidden");
  
  resetBoardState();
  updateTurnUI();
  renderBoard(); updatePadUI();
  renderMyCodeStatus(Array(CODE_LEN).fill("gray"));
});

socket.on('guess_result', (data) => {
  if (data.player === socket.id) {
    processMyGuess(data.guess, data.marks);
  } else {
    showMoveToast(data.guess, data.marks);
  }
  currentTurn = data.nextTurn;
  updateTurnUI();
});

socket.on('game_over', (data) => {
  if (data.winner === socket.id) {
    showNotify("Вы победили! Соперник не успел.", "success");
  } else {
    showNotify(`Вы проиграли. ${opponentName} угадал ваш код: ${data.code}`, "error");
  }
  setTimeout(() => location.reload(), 4000);
});

socket.on('chat_message', (data) => {
  addChatMsg(data.username, data.text, data.username === myUsername);
});

/* ============ ЯДРО ИГРЫ ============ */
function resetBoardState() {
  locked = Array(CODE_LEN).fill(false);
  lockedDigits = Array(CODE_LEN).fill(null);
  input = Array(CODE_LEN).fill("");
  attempts = [];
  cursor = 0;
  lastMarks = Array(CODE_LEN).fill("");
  lastGuess = null;
  botLockedDigits = Array(CODE_LEN).fill(null);
  botKnownWrong.clear();
  botCandidates = [];
  myCodeStatus = Array(CODE_LEN).fill("gray");
}

function startBotGame() {
  closeModal("mode-menu");
  isOnline = false;
  opponentName = "Бот";
  
  secretBot = Array.from({ length: CODE_LEN }, () => Math.floor(Math.random() * 10)).join("");
  mySecretCode = Array.from({ length: CODE_LEN }, () => Math.floor(Math.random() * 10)).join("");
  
  el.mainMenu.classList.add("hidden");
  el.gameScreen.classList.remove("hidden");
  
  resetBoardState();
  currentTurn = "human";
  updateTurnUI();
  renderBoard(); updatePadUI();
  renderMyCodeStatus(Array(CODE_LEN).fill("gray"));
}

function processMyGuess(guess, marks) {
  lastGuess = guess; lastMarks = marks;
  for (let i = 0; i < CODE_LEN; i++) {
    if (marks[i] === "green") { locked[i] = true; lockedDigits[i] = guess[i]; }
    else if (!locked[i]) attempts.push({ slot: i, digit: guess[i] });
  }
  input = Array(CODE_LEN).fill("");
  cursor = 0; moveCursorNext();
  renderBoard(); updatePadUI();
}

function updateTurnUI() {
  if (currentTurn === "human" || currentTurn === socket.id) {
    el.statusText.textContent = "ВАШ ХОД";
    el.statusText.style.color = "var(--green)";
  } else {
    el.statusText.textContent = `${opponentName.toUpperCase()} ДУМАЕТ`;
    el.statusText.style.color = "var(--yellow)";
  }
}

function submitGuess() {
  if (!isOnline && currentTurn !== "human") return;
  if (isOnline && currentTurn !== socket.id) return;

  const guess = input.map((d, i) => locked[i] ? lockedDigits[i] : d).join("");
  if (guess.length !== CODE_LEN || guess.includes("undefined")) return;

  if (isOnline) {
    socket.emit('make_guess', { roomId, guess });
  } else {
    const marks = scoreGuess(guess, secretBot);
    processMyGuess(guess, marks);
    if (marks.every(m => m === "green")) { showNotify("Вы угадали код!", "success"); setTimeout(() => location.reload(), 3000); return; }
    
    currentTurn = "bot";
    updateTurnUI();
    setTimeout(botTurn, 1000);
  }
}

function botTurn() {
  if (isOnline || currentTurn !== "bot") return;
  let guess = "";
  const diff = localStorage.getItem("gc_diff") || "hard";

  if (diff === "hard") {
    if (botCandidates.length === 0) {
      for (let n = 0; n < 1000000; n++) botCandidates.push(String(n).padStart(6, "0"));
    }
    guess = botCandidates[Math.floor(Math.random() * botCandidates.length)];
  } else {
    let arr = Array(CODE_LEN).fill(null);
    for (let i = 0; i < CODE_LEN; i++) if (botLockedDigits[i]) arr[i] = botLockedDigits[i];
    for (let i = 0; i < CODE_LEN; i++) {
      if (arr[i]) continue;
      let avail = "0123456789".split("").filter(d => !botKnownWrong.has(d) && !arr.includes(d));
      if (!avail.length) avail = "0123456789".split("");
      arr[i] = avail[Math.floor(Math.random() * avail.length)];
    }
    guess = arr.join("");
  }

  const marks = scoreGuess(guess, mySecretCode);
  for (let i = 0; i < CODE_LEN; i++) {
    if (marks[i] === "green") { botLockedDigits[i] = guess[i]; myCodeStatus[i] = "green"; }
    if (marks[i] === "gray") botKnownWrong.add(guess[i]);
  }

  if (diff === "hard") {
    botCandidates = botCandidates.filter(c => scoreGuess(guess, c).every((v, i) => v === marks[i]));
  }

  renderMyCodeStatus(myCodeStatus);
  showMoveToast(guess, marks);

  if (marks.every(m => m === "green")) {
    showNotify(`Бот угадал твой код: ${mySecretCode}`, "error");
    setTimeout(() => location.reload(), 4000);
    return;
  }

  setTimeout(() => { currentTurn = "human"; updateTurnUI(); }, 3000);
}

function scoreGuess(guess, secret) {
  const marks = Array(CODE_LEN).fill("gray");
  const sLeft = Array(CODE_LEN).fill(true);
  const gLeft = Array(CODE_LEN).fill(true);
  for (let i = 0; i < CODE_LEN; i++) if (guess[i] === secret[i]) { marks[i] = "green"; sLeft[i] = false; gLeft[i] = false; }
  for (let i = 0; i < CODE_LEN; i++) {
    if (!gLeft[i]) continue;
    for (let j = 0; j < CODE_LEN; j++) {
      if (sLeft[j] && secret[j] === guess[i]) { marks[i] = "yellow"; sLeft[j] = false; break; }
    }
  }
  return marks;
}

function putDigit(d) {
  if (!isOnline && currentTurn !== "human") return;
  if (isOnline && currentTurn !== socket.id) return;
  
  let slot = cursor;
  for (let k = 0; k < CODE_LEN; k++) {
    const s = (slot + k) % CODE_LEN;
    if (!locked[s] && !input[s]) { slot = s; break; }
  }
  if (locked[slot] || input[slot]) return;
  if (attempts.some(a => a.slot === slot && a.digit === d)) return;
  
  cursor = slot; input[slot] = d;
  moveCursorNext(); renderBoard(); updatePadUI();
}

function clearInput() {
  if (!isOnline && currentTurn !== "human") return;
  if (isOnline && currentTurn !== socket.id) return;
  for (let i = 0; i < CODE_LEN; i++) if (!locked[i]) input[i] = "";
  cursor = 0; moveCursorNext(); renderBoard(); updatePadUI();
}

function moveCursorNext() {
  for (let k = 0; k < CODE_LEN; k++) {
    const s = (cursor + k) % CODE_LEN;
    if (!locked[s] && !input[s]) { cursor = s; return; }
  }
}

function renderBoard() {
  el.board.innerHTML = "";
  for (let i = 0; i < CODE_LEN; i++) {
    const c = document.createElement("div");
    c.className = "cell";
    if (locked[i]) { c.classList.add("locked"); c.textContent = lockedDigits[i] ?? ""; }
    else if (input[i]) { c.textContent = input[i]; }
    else if (lastMarks[i] === "yellow" && lastGuess) { c.classList.add("fade-yellow"); c.textContent = lastGuess[i]; }
    else if (lastMarks[i] === "gray") { c.classList.add("fade-gray"); c.textContent = "•"; }
    if (i === cursor && !locked[i]) c.classList.add("cursor");
    el.board.appendChild(c);
  }
}

function updatePadUI() {
  const hints = {};
  if (lastMarks && lastGuess) {
    lastMarks.forEach((m, i) => { if (m === "yellow") hints[lastGuess[i]] = (hints[lastGuess[i]] || 0) + 1; });
  }

  const btns = el.pad.querySelectorAll('button[data-val]');
  btns.forEach(btn => {
    const val = btn.dataset.val;
    if (val === 'submit' || val === 'clear') return;

    const isCursorEmpty = !locked[cursor] && !input[cursor];
    const isTried = isCursorEmpty && attempts.some(a => a.slot === cursor && a.digit === val);
    btn.disabled = isTried;

    if (!btn.disabled && hints[val]) {
      btn.classList.add('hint');
      btn.setAttribute('data-hint', hints[val]);
    } else {
      btn.classList.remove('hint');
      btn.removeAttribute('data-hint');
    }
  });

  const subBtn = document.getElementById('btn-submit');
  subBtn.disabled = !input.every((d, i) => locked[i] || d !== "");
}

function renderMyCodeStatus(marks) {
  el.myCodeDigits.innerHTML = "";
  for (let i = 0; i < CODE_LEN; i++) {
    const d = document.createElement("div");
    d.className = "my-code-digit " + (marks ? marks[i] : "gray");
    d.textContent = mySecretCode ? mySecretCode[i] : "-";
    el.myCodeDigits.appendChild(d);
  }
}

/* ============ ЧАТ ============ */
function openChat() { openModal("chat-modal"); }
function addChatMsg(user, text, isMe) {
  const msg = document.createElement("div");
  msg.style.cssText = isMe
    ? "background: var(--accent); color: #fff; padding: 8px 12px; border-radius: 12px; align-self: flex-end; font-size: 14px; max-width: 80%;"
    : "background: var(--line); color: #fff; padding: 8px 12px; border-radius: 12px; align-self: flex-start; font-size: 14px; max-width: 80%;";
  msg.innerHTML = `<b style="font-size:10px; opacity:0.7; display:block; margin-bottom:2px;">${user}</b>${text}`;
  el.chatHistory.appendChild(msg);
  el.chatHistory.scrollTop = el.chatHistory.scrollHeight;
}

function sendChat() {
  const inp = document.getElementById("chat-input");
  const text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  if (isOnline) {
    socket.emit('chat_message', { roomId, text, username: myUsername });
  } else {
    addChatMsg(myUsername, text, true);
    setTimeout(() => addChatMsg("Бот", "Занятно. Продолжай угадывать.", false), 1000);
  }
}

/* ============ ОБРАБОТЧИКИ ============ */
el.pad.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || btn.disabled) return;
  const val = btn.dataset.val;
  if (val === 'submit') submitGuess();
  else if (val === 'clear') clearInput();
  else putDigit(val);
});
</script>
</body>
