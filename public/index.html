<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Угадай код</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap');

  :root {
    --bg: #0b0e14; --panel: #151a24; --line: #232a3b;
    --text: #ffffff; --muted: #6b7a99;
    --green: #00d26a; --red: #ff4757;
    --accent: #4a7dff;
    --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: 'Nunito', sans-serif; }
  
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px;
    background: var(--bg); color: var(--text); overflow: hidden; user-select: none;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .hidden { display: none !important; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; animation: fadeIn 0.2s; }
  .modal-content { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 24px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .modal-content h2 { margin: 0; font-size: 20px; text-align: center; font-weight: 900; }
  .modal-content p { margin: 0; text-align: center; color: var(--muted); font-size: 14px; font-weight: 600; }

  input[type="text"] { background: #000; border: 2px solid var(--line); border-radius: 12px; padding: 14px; color: var(--text); font-size: 16px; font-weight: 700; outline: none; width: 100%; text-align: center; transition: var(--transition); }
  input:focus { border-color: var(--accent); }
  button { border: none; outline: none; cursor: pointer; font-weight: 800; transition: var(--transition); display: flex; align-items: center; justify-content: center; }
  button:active { transform: scale(0.95); }
  
  .btn-main { background: var(--accent); color: #fff; padding: 16px; border-radius: 12px; font-size: 16px; width: 100%; }
  .btn-sec { background: var(--line); color: var(--text); padding: 16px; border-radius: 12px; font-size: 16px; width: 100%; }
  .btn-icon { background: var(--line); border-radius: 12px; padding: 12px; color: var(--text); }
  .btn-icon svg { width: 24px; height: 24px; fill: currentColor; }

  /* Главное меню */
  #main-menu { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 360px; gap: 16px; }
  .menu-title { font-size: 32px; font-weight: 900; letter-spacing: 2px; margin-bottom: 20px; text-align: center; background: linear-gradient(90deg, var(--accent), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: slideUp 0.5s; }
  .menu-input-group { display: flex; gap: 8px; width: 100%; animation: slideUp 0.6s; }
  .menu-buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; animation: slideUp 0.7s; }
  .bottom-bar { display: flex; justify-content: center; gap: 16px; margin-top: 20px; width: 100%; animation: slideUp 0.8s; }
  .bottom-btn { width: 60px; height: 60px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
  .bottom-btn svg { width: 24px; height: 24px; fill: var(--muted); }
  .bottom-btn span { font-size: 10px; color: var(--muted); font-weight: 700; }

  /* Игровое поле */
  .game-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 12px; background: var(--panel); padding: 8px 12px; border-radius: 16px; border: 1px solid var(--line); }
  .status { font-size: 14px; font-weight: 900; text-transform: uppercase; color: var(--accent); flex: 1; text-align: center; }
  
  .my-code-panel { width: 100%; display: flex; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 16px; margin-bottom: 8px; }
  .my-code-digits { display: flex; gap: 6px; }
  .my-code-digit { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; background: #000; border-radius: 6px; color: var(--muted); }
  .my-code-digit.green { background: var(--green); color: #000; }

  .board { display: flex; gap: 8px; width: 100%; margin-bottom: 24px; }
  .cell { flex: 1; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; border-radius: 12px; background: var(--panel); border: 2px solid var(--line); color: var(--text); }
  .cell.locked { background: var(--green); border-color: var(--green); color: #000; }
  .cell.cursor { border-color: var(--accent); }

  .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
  .pad button { position: relative; padding: 18px 0; font-size: 24px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; }
  .btn-submit { background: rgba(0, 210, 106, 0.1) !important; border-color: var(--green) !important; color: var(--green) !important; }
  .btn-reset { background: rgba(255, 71, 87, 0.1) !important; border-color: var(--red) !important; color: var(--red) !important; }

  /* Модалка ввода кода */
  .code-display { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
  .code-slot { width: 40px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; background: #000; border: 2px solid var(--line); border-radius: 8px; cursor: pointer; }
  .code-slot.active { border-color: var(--accent); }
  .pad-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; margin-top: 10px; }
  .pad-mini button { padding: 12px 0; font-size: 20px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
  .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .modal-actions button { flex: 1; padding: 12px 0; border-radius: 8px; }

  /* Чат */
  .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
  .chat-msg { padding: 8px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: 80%; }
  .chat-msg.bot { background: var(--line); align-self: flex-start; }
  .chat-msg.me { background: var(--accent); align-self: flex-end; }
</style>
</head>
<body>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="main-menu">
  <div class="menu-title">УГАДАЙ КОД</div>
  <div class="menu-input-group">
    <input type="text" id="nick-input" placeholder="Твой ник" maxlength="12">
  </div>
  <div class="menu-buttons">
    <button class="btn-main" onclick="openOnlineMenu()">Играть по сети</button>
    <button class="btn-sec" onclick="startBotGame()">Играть с ботом</button>
  </div>
  <div class="bottom-bar">
    <div class="bottom-btn" onclick="openSettings()">
      <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
    </div>
    <div class="bottom-btn" onclick="openFeedback()">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <span>Помощь</span>
    </div>
    <div class="bottom-btn" onclick="openDonate()">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span>Донат</span>
    </div>
  </div>
</div>

<!-- ОНЛАЙН МЕНЮ -->
<div class="modal-overlay hidden" id="online-menu">
  <div class="modal-content">
    <h2>Сетевая игра</h2>
    <button class="btn-main" onclick="showCodeInput('random')">Случайный поиск</button>
    <button class="btn-main" style="background: var(--green); color: #000;" onclick="showCodeInput('create')">Создать комнату</button>
    <button class="btn-sec" onclick="showJoinInput()">Войти по коду</button>
    <button class="btn-sec" style="background: transparent;" onclick="closeModal('online-menu')">Назад</button>
  </div>
</div>

<!-- ОКНО ВВОДА КОДА (ДЛЯ ИГРЫ) -->
<div class="modal-overlay hidden" id="code-screen">
  <div class="modal-content">
    <h2>Загадайте код</h2>
    <div class="code-display" id="code-display"></div>
    <div class="pad-mini" id="code-pad"></div>
    <div class="modal-actions">
      <button class="btn-reset" onclick="closeModal('code-screen')">✕</button>
      <button class="btn-sec" style="background: #00a8ff; color: #fff;" onclick="randomizeCode()">🎲</button>
      <button class="btn-submit" onclick="confirmCode()">✓</button>
    </div>
  </div>
</div>

<!-- ЭКРАН ОЖИДАНИЯ -->
<div class="modal-overlay hidden" id="waiting-screen">
  <div class="modal-content" style="align-items: center;">
    <h2 id="waiting-title">Поиск...</h2>
    <p id="waiting-timer">0 сек</p>
    <div id="room-code-display" class="hidden" style="font-size: 28px; font-weight: 900; letter-spacing: 6px; color: var(--accent); background: #000; padding: 16px; border-radius: 12px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 12px;">
      <span id="room-code-text"></span>
      <button onclick="copyRoomCode()" style="background: none; border: none; cursor: pointer; color: var(--muted);"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
    </div>
    <div style="border: 4px solid var(--line); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-top: 20px;" id="waiting-spinner"></div>
    <button class="btn-sec" style="margin-top: 20px;" onclick="location.reload()">Отмена</button>
  </div>
</div>

<!-- НАЙДЕН СОПЕРНИК -->
<div class="modal-overlay hidden" id="found-screen">
  <div class="modal-content">
    <h2>Соперник найден!</h2>
    <p id="found-name">Ник: Player2</p>
    <p id="found-time">Время поиска: 5 сек</p>
    <button class="btn-main" onclick="startFoundGame()">Начать игру</button>
    <button class="btn-sec" style="background: transparent;" onclick="location.reload()">Отмена</button>
  </div>
</div>

<!-- ВХОД ПО КОДУ -->
<div class="modal-overlay hidden" id="join-screen">
  <div class="modal-content">
    <h2>Вход по коду</h2>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="join-code-input" placeholder="XXXXXX" maxlength="6" style="text-transform: uppercase;">
      <button class="btn-icon" onclick="pasteRoomCode()"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg></button>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <button class="btn-sec" style="flex: 1;" onclick="closeModal('join-screen')">Отмена</button>
      <button class="btn-main" style="flex: 1;" onclick="submitJoin()">Вход</button>
    </div>
  </div>
</div>

<!-- НАСТРОЙКИ -->
<div class="modal-overlay hidden" id="settings-modal">
  <div class="modal-content">
    <h2>Настройки</h2>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span>Цвет интерфейса</span>
      <select id="setting-color" onchange="saveSettings()" style="padding: 8px; border-radius: 8px; background: #000; color: #fff; border: 1px solid var(--line);">
        <option value="#4a7dff">Синий</option>
        <option value="#00d26a">Зеленый</option>
        <option value="#ff4757">Красный</option>
        <option value="#a855f7">Фиолетовый</option>
        <option value="#ffb300">Желтый</option>
        <option value="#ec4899">Розовый</option>
        <option value="#06b6d4">Голубой</option>
        <option value="#f97316">Оранжевый</option>
      </select>
    </div>
    <button class="btn-main" onclick="closeModal('settings-modal')">Готово</button>
  </div>
</div>

<!-- ОБРАТНАЯ СВЯЗЬ -->
<div class="modal-overlay hidden" id="feedback-modal">
  <div class="modal-content">
    <h2>Обратная связь</h2>
    <p style="text-align: left;">Напишите сообщение об ошибке или пожелание:</p>
    <textarea id="feedback-text" style="width: 100%; height: 100px; background: #000; border: 1px solid var(--line); color: #fff; padding: 10px; border-radius: 8px; resize: none; outline: none; font-family: inherit;"></textarea>
    <button class="btn-main" id="btn-send-feedback" onclick="sendFeedback()">Отправить</button>
    <button class="btn-sec" style="background: transparent;" onclick="closeModal('feedback-modal')">Закрыть</button>
  </div>
</div>

<!-- ИГРОВОЙ ЭКРАН -->
<div id="game-screen" class="hidden" style="display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px;">
  <div class="top-bar">
    <button class="btn-icon" onclick="leaveGame()"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
    <div class="status" id="status-text">ВАШ ХОД</div>
    <button class="btn-icon" onclick="openChat()"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></button>
  </div>

  <div class="my-code-panel">
    <div class="my-code-digits" id="my-code-digits"></div>
  </div>

  <div class="board" id="board"></div>
  
  <div class="pad" id="pad">
    <button onclick="putDigit('1')">1</button><button onclick="putDigit('2')">2</button><button onclick="putDigit('3')">3</button><button class="btn-submit" onclick="submitGuess()">✓</button>
    <button onclick="putDigit('4')">4</button><button onclick="putDigit('5')">5</button><button onclick="putDigit('6')">6</button><button class="btn-reset" onclick="clearInput()">×</button>
    <button onclick="putDigit('7')">7</button><button onclick="putDigit('8')">8</button><button onclick="putDigit('9')">9</button><button onclick="putDigit('0')">0</button>
  </div>
</div>

<!-- ЧАТ -->
<div class="modal-overlay hidden" id="chat-modal">
  <div class="modal-content" style="height: 60vh;">
    <div class="chat-history" id="chat-history"></div>
    <div style="display: flex; gap: 8px; margin-top: auto;">
      <input type="text" id="chat-input" placeholder="Сообщение...">
      <button class="btn-icon" onclick="sendChat()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
    <button class="btn-sec" style="margin-top: 10px;" onclick="closeModal('chat-modal')">Закрыть</button>
  </div>
</div>

<!-- РЕЗУЛЬТАТ ИГРЫ + РЕМАТЧ -->
<div class="modal-overlay hidden" id="result-modal">
  <div class="modal-content">
    <h2 id="result-title">Победа!</h2>
    <p id="result-desc">Вы угадали код</p>
    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <button class="btn-sec" style="flex: 1;" onclick="location.reload()">Отмена</button>
      <button class="btn-main" style="flex: 1;" id="btn-rematch" onclick="requestRematch()">Сыграть ещё</button>
    </div>
    <div id="rematch-status" class="hidden" style="text-align: center; margin-top: 10px;">
      <p id="rematch-text">Ожидание...</p>
      <div class="spinner" style="border-top-color: var(--accent); margin: 10px auto;"></div>
    </div>
  </div>
</div>

<script>
"use strict";
const socket = io();
const CODE_LEN = 6;

let myUsername = localStorage.getItem("gc_nick") || "";
let isOnline = false;
let roomId = null;
let currentTurn = null;
let opponentName = "Бот";

let locked = Array(CODE_LEN).fill(false);
let lockedDigits = Array(CODE_LEN).fill(null);
let input = Array(CODE_LEN).fill("");
let cursor = 0;
let attempts = [];

let mySecretCode = "";
let myCodeStatus = Array(CODE_LEN).fill("gray");
let secretBot = "";
let botLockedDigits = Array(CODE_LEN).fill(null);
let botKnownWrong = new Set();
let botCandidates = [];
let searchStartTime = 0;
let searchTimerInterval = null;

const el = {
  mainMenu: document.getElementById("main-menu"),
  onlineMenu: document.getElementById("online-menu"),
  codeScreen: document.getElementById("code-screen"),
  waitingScreen: document.getElementById("waiting-screen"),
  foundScreen: document.getElementById("found-screen"),
  joinScreen: document.getElementById("join-screen"),
  gameScreen: document.getElementById("game-screen"),
  statusText: document.getElementById("status-text"),
  board: document.getElementById("board"),
  pad: document.getElementById("pad"),
  myCodeDigits: document.getElementById("my-code-digits"),
  codeDisplay: document.getElementById("code-display"),
  codePad: document.getElementById("code-pad"),
  nickInput: document.getElementById("nick-input"),
  settingsModal: document.getElementById("settings-modal"),
  settingColor: document.getElementById("setting-color"),
  feedbackModal: document.getElementById("feedback-modal"),
  feedbackText: document.getElementById("feedback-text"),
  resultModal: document.getElementById("result-modal"),
  resultTitle: document.getElementById("result-title"),
  resultDesc: document.getElementById("result-desc"),
  btnRematch: document.getElementById("btn-rematch"),
  rematchStatus: document.getElementById("rematch-status"),
  rematchText: document.getElementById("rematch-text"),
};

// Инициализация
if (myUsername) el.nickInput.value = myUsername;
const savedColor = localStorage.getItem("gc_color") || "#4a7dff";
el.settingColor.value = savedColor;
document.documentElement.style.setProperty('--accent', savedColor);

el.nickInput.addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/[^a-zA-Zа-яА-Я0-9_\-]/g, '').slice(0, 12);
});

/* ============ МЕНЮ И НАСТРОЙКИ ============ */
function closeModal(id) { document.getElementById(id).classList.add("hidden"); }
function openModal(id) { document.getElementById(id).classList.remove("hidden"); }

function openOnlineMenu() {
  const nick = el.nickInput.value.trim();
  if (nick.length < 3) { alert("Ник должен быть минимум 3 символа"); return; }
  myUsername = nick;
  localStorage.setItem("gc_nick", nick);
  closeModal("main-menu");
  el.mainMenu.classList.add("hidden");
  openModal("online-menu");
}

function openSettings() { openModal("settings-modal"); }
function saveSettings() {
  localStorage.setItem("gc_color", el.settingColor.value);
  document.documentElement.style.setProperty('--accent', el.settingColor.value);
}

function openFeedback() {
  el.feedbackText.value = "";
  openModal("feedback-modal");
}

async function sendFeedback() {
  const text = el.feedbackText.value.trim();
  if (!text) return;
  const btn = document.getElementById("btn-send-feedback");
  btn.disabled = true;
  btn.textContent = "Отправка...";
  
  try {
    await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nick: myUsername || "Гость", text })
    });
    btn.textContent = "Отправлено!";
    setTimeout(() => { closeModal('feedback-modal'); btn.disabled = false; btn.textContent = "Отправить"; }, 1500);
  } catch (e) {
    btn.textContent = "Ошибка";
    setTimeout(() => { btn.disabled = false; btn.textContent = "Отправить"; }, 1500);
  }
}

function openDonate() { alert("Донат скоро появится!"); }

/* ============ ВВОД КОДА ============ */
let codeInput = Array(CODE_LEN).fill("");
let codeCursor = 0;

function showCodeInput(mode) {
  closeModal("online-menu");
  el.onlineMenu.classList.add("hidden");
  openModal("code-screen");
  
  codeInput = Array(CODE_LEN).fill("");
  codeCursor = 0;
  renderCodeDisplay();
  renderCodePad();
}

function renderCodeDisplay() {
  el.codeDisplay.innerHTML = "";
  for (let i = 0; i < CODE_LEN; i++) {
    const slot = document.createElement("div");
    slot.className = "code-slot" + (i === codeCursor ? " active" : "");
    slot.textContent = codeInput[i] || "";
    slot.onclick = () => {
      codeCursor = i;
      codeInput[i] = "";
      renderCodeDisplay();
    };
    el.codeDisplay.appendChild(slot);
  }
}

function renderCodePad() {
  el.codePad.innerHTML = "";
  for (let i = 1; i <= 9; i++) {
    const btn = document.createElement("button");
    btn.textContent = i;
    btn.onclick = () => {
      if (codeCursor < CODE_LEN) {
        codeInput[codeCursor] = i.toString();
        if (codeCursor < CODE_LEN - 1) codeCursor++;
        renderCodeDisplay();
      }
    };
    el.codePad.appendChild(btn);
  }
  const btn0 = document.createElement("button");
  btn0.textContent = "0";
  btn0.onclick = () => {
    if (codeCursor < CODE_LEN) {
      codeInput[codeCursor] = "0";
      if (codeCursor < CODE_LEN - 1) codeCursor++;
      renderCodeDisplay();
    }
  };
  const btnDel = document.createElement("button");
  btnDel.textContent = "⌫";
  btnDel.onclick = () => {
    if (codeInput[codeCursor]) {
      codeInput[codeCursor] = "";
    } else if (codeCursor > 0) {
      codeCursor--;
      codeInput[codeCursor] = "";
    }
    renderCodeDisplay();
  };
  el.codePad.appendChild(btn0);
  el.codePad.appendChild(btnDel);
}

function randomizeCode() {
  for (let i = 0; i < CODE_LEN; i++) codeInput[i] = Math.floor(Math.random() * 10).toString();
  codeCursor = CODE_LEN - 1;
  renderCodeDisplay();
}

let gameMode = "";
function confirmCode() {
  const code = codeInput.join("");
  if (code.length !== CODE_LEN) { alert("Введи все 6 цифр!"); return; }
  
  mySecretCode = code;
  closeModal("code-screen");
  
  if (gameMode === "random") {
    openWaitingScreen("Поиск соперника...");
    socket.emit('find_random', { username: myUsername, code: code });
  } else if (gameMode === "create") {
    openWaitingScreen("Создание комнаты...");
    socket.emit('create_room', { username: myUsername, code: code });
  } else if (gameMode === "join") {
    openWaitingScreen("Подключение...");
    socket.emit('join_room', { username: myUsername, code: code, roomCode: targetRoomCode });
  }
}

/* ============ ОЖИДАНИЕ ============ */
function openWaitingScreen(title) {
  openModal("waiting-screen");
  document.getElementById("waiting-title").textContent = title;
  document.getElementById("room-code-display").classList.add("hidden");
  document.getElementById("waiting-spinner").classList.remove("hidden");
  document.getElementById("waiting-timer").classList.remove("hidden");
  
  searchStartTime = Date.now();
  if (searchTimerInterval) clearInterval(searchTimerInterval);
  searchTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - searchStartTime) / 1000);
    document.getElementById("waiting-timer").textContent = `${elapsed} сек`;
  }, 1000);
}

socket.on('room_created', (data) => {
  document.getElementById("waiting-title").textContent = "Комната создана";
  document.getElementById("waiting-timer").classList.add("hidden");
  document.getElementById("room-code-text").textContent = data.roomCode;
  document.getElementById("room-code-display").classList.remove("hidden");
  document.getElementById("waiting-spinner").classList.add("hidden");
});

function copyRoomCode() {
  const code = document.getElementById("room-code-text").textContent;
  navigator.clipboard.writeText(code).then(() => {
    alert("Код скопирован!");
  });
}

/* ============ ВХОД ПО КОДУ ============ */
function showJoinInput() {
  closeModal("online-menu");
  el.onlineMenu.classList.add("hidden");
  document.getElementById("join-code-input").value = "";
  openModal("join-screen");
}

function pasteRoomCode() {
  navigator.clipboard.readText().then(text => {
    document.getElementById("join-code-input").value = text.toUpperCase().slice(0, 6);
  });
}

function submitJoin() {
  const code = document.getElementById("join-code-input").value.trim().toUpperCase();
  if (code.length !== 6) { alert("Код должен быть 6 символов"); return; }
  targetRoomCode = code;
  closeModal("join-screen");
  gameMode = "join";
  showCodeInput("join");
}

/* ============ ИГРА ============ */
socket.on('waiting_random', () => {});

socket.on('game_start', (data) => {
  isOnline = true;
  roomId = data.roomId;
  currentTurn = data.turn;
  opponentName = (data.p1_name === myUsername) ? data.p2_name : data.p1_name;

  closeModal("waiting-screen");
  closeModal("found-screen");
  closeModal("result-modal");
  el.mainMenu.classList.add("hidden");
  el.gameScreen.classList.remove("hidden");

  if (searchTimerInterval) clearInterval(searchTimerInterval);
  
  resetBoardState();
  updateStatusUI();
  renderBoard(); renderPad();
  renderMyCodeStatus(Array(CODE_LEN).fill("gray"));
});

socket.on('guess_result', (data) => {
  if (data.player === socket.id) {
    processMyGuess(data.guess, data.marks);
  } else {
    // Обновляем статус нашего кода
    for (let i = 0; i < CODE_LEN; i++) {
      if (data.marks[i] === "green") myCodeStatus[i] = "green";
    }
    renderMyCodeStatus(myCodeStatus);
  }
  currentTurn = data.nextTurn;
  updateStatusUI();
  renderBoard();
  renderPad();
});

socket.on('game_over', (data) => {
  showResult(data.winner === socket.id, data.code);
});

socket.on('opponent_left', () => {
  alert("Соперник покинул игру");
  location.reload();
});

socket.on('rematch_offered', (data) => {
  document.getElementById("result-title").textContent = "Предложение рематча";
  document.getElementById("result-desc").textContent = `${data.from} хочет сыграть еще раз`;
  document.getElementById("btn-rematch").textContent = "Принять";
  document.getElementById("btn-rematch").onclick = () => socket.emit('rematch_request', { roomId });
});

socket.on('rematch_declined', () => {
  document.getElementById("rematch-text").textContent = `${opponentName} отказался от повторной игры`;
  document.getElementById("rematch-status").classList.remove("hidden");
  setTimeout(() => location.reload(), 2000);
});

function requestRematch() {
  socket.emit('rematch_request', { roomId });
  el.btnRematch.disabled = true;
  el.btnRematch.classList.add("hidden");
  el.rematchStatus.classList.remove("hidden");
  el.rematchText.textContent = `Ожидание ${opponentName}...`;
}

/* ============ ЯДРО ============ */
function resetBoardState() {
  locked = Array(CODE_LEN).fill(false);
  lockedDigits = Array(CODE_LEN).fill(null);
  input = Array(CODE_LEN).fill("");
  attempts = [];
  cursor = 0;
  myCodeStatus = Array(CODE_LEN).fill("gray");
  botLockedDigits = Array(CODE_LEN).fill(null);
  botKnownWrong.clear();
  botCandidates = [];
}

function updateStatusUI() {
  if (currentTurn === "human" || currentTurn === socket.id) {
    el.statusText.textContent = "ВАШ ХОД";
    el.statusText.style.color = "var(--green)";
  } else {
    el.statusText.textContent = `${opponentName.toUpperCase()} ДУМАЕТ`;
    el.statusText.style.color = "var(--yellow)";
  }
}

function submitGuess() {
  if (!isMyTurn()) return;
  const guess = input.map((d, i) => locked[i] ? lockedDigits[i] : d).join("");
  if (guess.length !== CODE_LEN || guess.includes("")) return;

  if (isOnline) {
    socket.emit('make_guess', { roomId, guess });
  } else {
    const marks = scoreGuess(guess, secretBot);
    processMyGuess(guess, marks);
    renderBoard(); renderPad();
    if (marks.every(m => m === "green")) { showResult(true, secretBot); return; }
    currentTurn = "bot";
    updateStatusUI();
    setTimeout(botTurn, 1000);
  }
}

function processMyGuess(guess, marks) {
  for (let i = 0; i < CODE_LEN; i++) {
    if (marks[i] === "green") { locked[i] = true; lockedDigits[i] = guess[i]; }
    else if (!locked[i]) attempts.push({ slot: i, digit: guess[i] });
  }
  input = Array(CODE_LEN).fill("");
  cursor = 0;
  moveCursorNext();
}

function scoreGuess(guess, secret) {
  const marks = Array(CODE_LEN).fill("gray");
  const sLeft = Array(CODE_LEN).fill(true);
  const gLeft = Array(CODE_LEN).fill(true);
  for (let i = 0; i < CODE_LEN; i++) if (guess[i] === secret[i]) { marks[i] = "green"; sLeft[i] = false; gLeft[i] = false; }
  return marks;
}

function startBotGame() {
  const nick = el.nickInput.value.trim();
  if (nick.length < 3) { alert("Ник минимум 3 символа"); return; }
  myUsername = nick;
  localStorage.setItem("gc_nick", nick);
  
  el.mainMenu.classList.add("hidden");
  isOnline = false;
  opponentName = "Бот";
  currentTurn = "human";
  secretBot = Array.from({ length: CODE_LEN }, () => Math.floor(Math.random() * 10)).join("");
  mySecretCode = Array.from({ length: CODE_LEN }, () => Math.floor(Math.random() * 10)).join("");
  
  resetBoardState();
  el.gameScreen.classList.remove("hidden");
  updateStatusUI();
  renderBoard(); renderPad(); renderMyCodeStatus(myCodeStatus);
}

function botTurn() {
  if (currentTurn !== "bot") return;
  let guess = Array.from({ length: CODE_LEN }, () => Math.floor(Math.random() * 10)).join("");
  const marks = scoreGuess(guess, mySecretCode);
  for (let i = 0; i < CODE_LEN; i++) if (marks[i] === "green") myCodeStatus[i] = "green";
  renderMyCodeStatus(myCodeStatus);
  
  if (marks.every(m => m === "green")) { showResult(false, mySecretCode); return; }
  currentTurn = "human";
  updateStatusUI();
}

function putDigit(d) {
  if (!isMyTurn()) return;
  let slot = cursor;
  for (let k = 0; k < CODE_LEN; k++) {
    const s = (slot + k) % CODE_LEN;
    if (!locked[s] && !input[s]) { slot = s; break; }
  }
  if (locked[slot] || input[slot]) return;
  cursor = slot; input[slot] = d;
  moveCursorNext(); renderBoard(); renderPad();
}

function clearInput() {
  if (!isMyTurn()) return;
  for (let i = 0; i < CODE_LEN; i++) if (!locked[i]) input[i] = "";
  cursor = 0; moveCursorNext(); renderBoard(); renderPad();
}

function moveCursorNext() {
  for (let k = 0; k < CODE_LEN; k++) {
    const s = (cursor + k) % CODE_LEN;
    if (!locked[s] && !input[s]) { cursor = s; return; }
  }
}

function isMyTurn() {
  if (isOnline) return currentTurn === socket.id;
  return currentTurn === "human";
}

function renderBoard() {
  el.board.innerHTML = "";
  for (let i = 0; i < CODE_LEN; i++) {
    const c = document.createElement("div");
    c.className = "cell";
    if (locked[i]) { c.classList.add("locked"); c.textContent = lockedDigits[i]; }
    else if (input[i]) { c.textContent = input[i]; }
    if (i === cursor && !locked[i] && isMyTurn()) c.classList.add("cursor");
    el.board.appendChild(c);
  }
}

function renderPad() {
  // Просто обновляем состояние кнопок, если нужно
}

function renderMyCodeStatus(marks) {
  el.myCodeDigits.innerHTML = "";
  for (let i = 0; i < CODE_LEN; i++) {
    const d = document.createElement("div");
    d.className = "my-code-digit " + (marks ? marks[i] : "gray");
    d.textContent = mySecretCode ? mySecretCode[i] : "-";
    el.myCodeDigits.appendChild(d);
  }
}

function showResult(isWin, code) {
  el.gameScreen.classList.add("hidden");
  openModal("result-modal");
  
  if (isWin) {
    el.resultTitle.textContent = "Победа!";
    el.resultTitle.style.color = "var(--green)";
    el.resultDesc.innerHTML = `Вы угадали код игрока <b>${opponentName}</b><br><br><span style="font-size:24px; letter-spacing:4px; font-weight:900; color:#fff;">${code}</span>`;
  } else {
    el.resultTitle.textContent = "Поражение";
    el.resultTitle.style.color = "var(--red)";
    el.resultDesc.innerHTML = `Соперник угадал ваш код:<br><br><span style="font-size:24px; letter-spacing:4px; font-weight:900; color:#fff;">${code}</span>`;
  }
}

function leaveGame() {
  if (confirm("Вы уверены, что хотите выйти? Соперник получит поражение.")) {
    if (isOnline) socket.emit('leave_game', { roomId });
    location.reload();
  }
}

/* ============ ЧАТ ============ */
function openChat() { openModal("chat-modal"); }
function sendChat() {
  const inp = document.getElementById("chat-input");
  if (!inp.value.trim()) return;
  const hist = document.getElementById("chat-history");
  const msg = document.createElement("div");
  msg.className = "chat-msg me";
  msg.textContent = inp.value;
  hist.appendChild(msg);
  inp.value = "";
  hist.scrollTop = hist.scrollHeight;
}

window.addEventListener('beforeunload', () => {
  if (isOnline && roomId) socket.emit('leave_game', { roomId });
});
</script>
